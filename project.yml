# XcodeGen spec. The .xcodeproj is generated in CI (and on any Mac with
# `xcodegen generate`), so no binary project file lives in git.
name: HomifyStudio
options:
  bundleIdPrefix: studio.homify
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  HomifyCore:
    path: Packages/HomifyCore

targets:
  HomifyStudio:
    type: application
    platform: iOS
    sources:
      - path: App/HomifyStudio
    dependencies:
      - package: HomifyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.homify.app
        PRODUCT_NAME: HomifyStudio
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
    info:
      path: App/HomifyStudio/Info.plist
      properties:
        CFBundleDisplayName: Homify Studio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: Homify Studio saves your exported videos to your photo library.

  HomifyStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/HomifyStudioTests
    dependencies:
      - target: HomifyStudio
      - package: HomifyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.homify.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HomifyStudio.app/HomifyStudio
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  HomifyStudio:
    build:
      targets:
        HomifyStudio: all
        HomifyStudioTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - HomifyStudioTests
    archive:
      config: Release
